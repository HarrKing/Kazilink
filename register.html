<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProConnect | Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .register-container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #0a66c2;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #0a66c2;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #0a66c2;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #004182;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #555;
    }

    .login-link a {
      color: #0a66c2;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="register-container">

    <div class="logo">Kazilink</div>

    <p class="subtitle">Connect to jobs across Kenya</p>

    <h2>Create your account</h2>

    <form id="registerForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <button type="submit">Create Account</button>

      <div id="message"></div>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="index.html">Log in</a>
    </div>

  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = "https://fvrvrbqigkrnykmpnuhc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JhgS7eZPmbCPzxYQaTkYyQ_12AQRRYX";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Creating your account...";

      try {

        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: name
            }
          }
        });

        if (error) {
          message.textContent = error.message;
          return;
        }

        message.textContent =
          "Account created successfully! Check your email to confirm your account.";

        form.reset();

      } catch (error) {

        message.textContent =
          "Something went wrong. Please try again.";

        console.error(error);

      }

    });

  </script>

</body>
</html>
